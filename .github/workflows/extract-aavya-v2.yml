name: Extract AAVYA ZIP to Source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive
        run: |
          test -f aavya---b2b-digital-mental-wellbeing-platform.zip
          rm -rf extracted-aavya
          mkdir extracted-aavya
          unzip -q aavya---b2b-digital-mental-wellbeing-platform.zip -d extracted-aavya
          cp -a extracted-aavya/. .
          rm -rf extracted-aavya
          rm -f aavya---b2b-digital-mental-wellbeing-platform.zip

      - name: Open extraction PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: aavya-extracted
          delete-branch: false
          base: main
          title: 'Extract AAVYA application source'
          commit-message: 'Extract AAVYA application source'
          body: 'Extracts the uploaded AAVYA ZIP into normal source files and assets.'
