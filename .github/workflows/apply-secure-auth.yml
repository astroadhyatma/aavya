name: Apply secure AAVYA authentication

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply secure auth patch
        run: python scripts/secure_auth.py

      - name: Push secure-auth branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B aavya-secure-auth
          git add -A
          git commit -m 'Move student authentication to private backend'
          git push --force origin aavya-secure-auth
