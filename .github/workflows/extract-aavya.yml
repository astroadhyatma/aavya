name: Extract AAVYA App

on:
  push:
    paths:
      - 'aavya---b2b-digital-mental-wellbeing-platform.zip'
      - '.github/workflows/extract-aavya.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract app archive
        run: |
          rm -rf extracted-aavya
          mkdir -p extracted-aavya
          unzip -q aavya---b2b-digital-mental-wellbeing-platform.zip -d extracted-aavya
          cp -a extracted-aavya/. .
          rm -rf extracted-aavya
          rm -f aavya---b2b-digital-mental-wellbeing-platform.zip

      - name: Create extraction PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: aavya-extracted
          delete-branch: false
          title: 'Extract AAVYA application source'
          commit-message: 'Extract AAVYA application source'
          body: 'Extracts the uploaded AAVYA ZIP into normal repository files so the app can be deployed and edited file-by-file.'
          base: main
